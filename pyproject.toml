[project]
name = "anatomy-of-an-api-call"
version = "0.1.0"
description = "A small Python learning project for understanding API calls"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110.0", "openai>=1.40.0", "uvicorn>=0.27.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
